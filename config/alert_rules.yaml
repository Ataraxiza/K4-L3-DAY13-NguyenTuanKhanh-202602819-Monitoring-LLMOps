alerts:
  - name: fast_success_slo_breach
    severity: critical
    condition: "fast_success_rate_pct < 99.5 and request_count >= 20 over rolling 5m"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: lab-operator
    runbook: docs/alerts.md#alert-1
  - name: elevated_request_error_rate
    severity: critical
    condition: "error_rate_pct > 2 and request_count >= 20 over rolling 5m"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: lab-operator
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success_rate
    severity: warning
    condition: "tool_success_rate_pct < 90 and retrieval_attempts >= 10 over rolling 5m"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: lab-operator
    runbook: docs/alerts.md#alert-3
